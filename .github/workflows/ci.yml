name: Vachanam Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./database/dev.db"
      NODE_ENV: test
      ADMIN_API_KEY: "vachanam_admin_secret_key_2026"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Generate Prisma Engine & Initialize Database
      run: |
        npx prisma generate --schema=database/schema.prisma
        npx prisma db push --schema=database/schema.prisma
        node scripts/importBible.js

    - name: Run Server API Tests
      run: npm test

    - name: Build Web Application
      run: npm run build --workspace=frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_APP_URL: http://localhost:3000
